<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StudyCircle - Notes from students, for students</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar sc-nav"><div class="container">
  <a class="navbar-brand fw-bold" href="#" onclick="scShow('home');return false">StudyCircle</a>
  <div class="ms-auto d-flex gap-2 align-items-center flex-wrap" id="navRight"></div>
</div></nav>

<header class="sc-hero"><div class="container-fluid px-3 px-md-4">
  <div class="d-flex flex-wrap gap-2 align-items-center">
    <input id="q" class="form-control form-control-sm" style="max-width:260px" placeholder="Search notes" onkeydown="if(event.key==='Enter')scLoadNotes()">
    <select id="sem" class="form-select form-select-sm" style="max-width:150px"><option value="">All semesters</option>
      <option value="1">Semester 1</option><option value="2">Semester 2</option><option value="3">Semester 3</option><option value="4">Semester 4</option>
      <option value="5">Semester 5</option><option value="6">Semester 6</option><option value="7">Semester 7</option><option value="8">Semester 8</option></select>
    <button class="btn btn-sm btn-sc" onclick="scLoadNotes()">Search</button>
  </div>
</div></header>

<main class="container my-4">
  <div id="alertBox"></div>
  <section id="view-browse"><div id="noteList" class="row g-3"></div></section>
  <section id="view-dash" class="d-none"></section>
  <section id="view-upload" class="d-none">
    <div class="card sc-card"><div class="card-body">
      <h4 class="mb-1">Upload a note</h4>
      <p class="text-muted">PDF, Word, PowerPoint or text, up to 5 MB. An admin checks it before it goes live.</p>
      <div id="upAlert"></div>
      <div class="row g-3">
        <div class="col-md-6"><label class="form-label">Title</label><input id="u_title" class="form-control"></div>
        <div class="col-md-4"><label class="form-label">Subject</label><input id="u_subject" class="form-control" placeholder="e.g. Data Structures"></div>
        <div class="col-md-2"><label class="form-label">Semester</label><input id="u_sem" type="number" min="1" max="8" class="form-control"></div>
        <div class="col-12"><label class="form-label">Short description</label><input id="u_desc" class="form-control"></div>
        <div class="col-12"><label class="form-label">File</label><input id="u_file" type="file" class="form-control" accept=".pdf,.doc,.docx,.ppt,.pptx,.txt"></div>
      </div>
      <button class="btn btn-sc mt-3" onclick="scUpload()">Upload note</button>
    </div></div>
  </section>
</main>
<footer class="app-footer">
  <div class="container">
    StudyCircle<span class="sep">|</span>Developed by <strong>Khuman Ritu</strong>
  </div>
</footer>

<div class="modal fade" id="authModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title" id="authTitle">Log in</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body">
    <div id="authAlert"></div>
    <div id="regOnly" class="d-none">
      <div class="mb-3"><label class="form-label">Full name</label><input id="a_name" class="form-control"></div>
      <div class="mb-3"><label class="form-label">I am a</label>
        <select id="a_role" class="form-select"><option value="student">Student</option><option value="admin">Admin (checks uploaded notes)</option></select></div>
    </div>
    <div class="mb-3"><label class="form-label">Email</label><input id="a_email" type="email" class="form-control"></div>
    <div class="mb-3"><label class="form-label">Password</label><input id="a_pass" type="password" class="form-control"></div>
    <button class="btn btn-sc w-100" id="authBtn" onclick="scSubmitAuth()">Log in</button>
    <p class="text-center mt-3 mb-0"><a href="#" id="authSwitch" onclick="scToggleAuth();return false">New here? Create an account</a></p>
  </div>
</div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
<script src="site.js"></script>
</body>
</html>
